services:
  frontend:
    build:
      context: ./frontend
      target: build
    command: "npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./backend/asyncapi.json:/app/src/asyncapi.json:ro # Auto-generated by backend on file changes
      - /app/node_modules

  backend:
    command: "uv run uvicorn main:app --host 0.0.0.0 --reload --forwarded-allow-ips=*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__